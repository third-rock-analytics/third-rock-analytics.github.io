<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project map — Third Rock Analytics</title>
  <meta name="description" content="An interactive map of Third Rock Analytics projects.">
  <meta name="author" content="Jeff Zivkovic">
  <link rel="canonical" href="https://thirdrockanalytics.com/map/">
  <meta property="og:title" content="Project map — Third Rock Analytics">
  <meta property="og:description" content="Every Third Rock Analytics project, pinned in place on an interactive map.">
  <meta property="og:image" content="https://thirdrockanalytics.com/assets/logos/og-image.png">
  <meta property="og:url" content="https://thirdrockanalytics.com/map/">
  <meta property="og:type" content="website">
  <link rel="icon" href="/assets/logos/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/logos/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- MapLibre -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link rel="stylesheet" href="/style.css">

  <style>
    body { overflow: hidden; }
    .nav > .wrap { border-inline: 0; }  /* no frame lines over the full-bleed map */

    .map-page {
      position: fixed;
      top: var(--nav-h);
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: 360px 1fr;
    }

    /* Sidebar */
    .map-sidebar {
      background: #fff;
      border-right: 1px solid var(--line);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .map-sidebar__header {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 24px 24px 20px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .map-sidebar__title { font-size: var(--text-xl); font-weight: 600; color: var(--ink); letter-spacing: -0.02em; }
    .map-sidebar__sub { margin-top: 4px; font-size: var(--text-sm); color: var(--muted); }

    .project-list { display: flex; flex-direction: column; }
    .project-item {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .project-item:hover { background: var(--bg-alt); }
    .project-item.active { background: var(--earth-tint); box-shadow: inset 3px 0 0 var(--earth); }
    .project-item__index {
      flex: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      display: grid;
      place-items: center;
      margin-top: 1px;
    }
    .project-item.active .project-item__index { background: var(--earth); }
    .project-item__body { flex: 1; min-width: 0; }
    .project-item__title { font-weight: 600; color: var(--ink); line-height: 1.3; }
    .project-item__loc { margin-top: 2px; font-size: var(--text-sm); color: var(--muted); }

    .sidebar-cs { margin: 20px 24px 24px; padding: 20px; background: var(--bg-alt); border-radius: var(--radius); }
    .sidebar-cs__label { font-weight: 600; color: var(--ink); }
    .sidebar-cs__body { margin-top: 4px; font-size: var(--text-sm); }
    .sidebar-cs .btn { margin-top: 14px; }

    /* Map */
    .map-canvas { position: relative; background: var(--bg-alt); }
    #map { position: absolute; inset: 0; }
    .maplibregl-ctrl-attrib { font-size: 11px !important; }
    .maplibregl-ctrl-group { border-radius: 6px !important; }

    .tr-marker {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--ink);
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(22, 24, 27, 0.35);
      color: #fff;
      font: 600 12px/1 var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .tr-marker.active { background: var(--earth); width: 32px; height: 32px; }

    .maplibregl-popup-content {
      padding: 18px 20px !important;
      border-radius: var(--radius) !important;
      box-shadow: 0 8px 24px rgba(22, 24, 27, 0.14) !important;
      max-width: 320px !important;
      font-family: var(--font);
    }
    .maplibregl-popup-close-button { font-size: 20px !important; color: var(--muted) !important; padding: 2px 8px !important; }
    .popup-eyebrow { font-size: 0.75rem; font-weight: 500; color: var(--muted); }
    .popup-title { margin-top: 2px; font-size: 1.0625rem; font-weight: 600; color: var(--ink); line-height: 1.3; }
    .popup-desc { margin-top: 6px; font-size: 0.8125rem; line-height: 1.55; color: var(--text); }
    .popup-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .popup-stat b { display: block; font-size: 0.75rem; font-weight: 500; color: var(--muted); }
    .popup-link { display: inline-block; margin-top: 12px; font-size: 0.8125rem; font-weight: 500; color: var(--earth); }
    .popup-stat span { font-size: 0.875rem; font-weight: 600; color: var(--ink); }

    .sheet-handle, .sheet-cta { display: none; }

    @media (max-width: 780px) {
      .map-page { grid-template-columns: 1fr; }
      .map-canvas { grid-row: 1; grid-column: 1; }
      .map-sidebar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 76px;
        max-height: calc(100% - 20px);
        border-right: 0;
        border-top: 1px solid var(--line);
        border-radius: 14px 14px 0 0;
        box-shadow: 0 -4px 20px rgba(22, 24, 27, 0.12);
        overflow: hidden;
        transition: height 300ms ease;
        z-index: 100;
      }
      .map-sidebar.sheet-open { height: 60vh; overflow-y: auto; }
      .map-sidebar__header { padding: 0 20px 16px; cursor: pointer; user-select: none; }
      .sheet-handle { display: block; width: 32px; height: 4px; margin: 8px auto; background: var(--line); border-radius: 999px; }
      .sheet-cta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-radius: 6px;
        background: var(--ink);
        color: #fff;
        font-size: var(--text-sm);
        font-weight: 500;
      }
      .sheet-cta__chevron { transition: transform 300ms ease; }
      .map-sidebar.sheet-open .sheet-cta__chevron { transform: rotate(180deg); }
      .map-sidebar__title { margin-top: 20px; }
      .maplibregl-popup-content { max-width: min(280px, 82vw) !important; padding: 14px 16px !important; }
    }
  </style>
</head>
<body>

  <nav class="nav" id="nav" aria-label="Main">
    <div class="wrap nav-inner">
      <a href="/" class="nav-logo" aria-label="Third Rock Analytics home">
        <img src="/assets/logos/logo.svg" alt="Third Rock Analytics" width="347" height="72">
      </a>
      <ul class="nav-links" id="nav-links" role="list">
        <li><a href="/#services" class="nav-link">Services</a></li>
        <li><a href="/#work" class="nav-link" aria-current="page">Work</a></li>
        <li><a href="/#about" class="nav-link">About</a></li>
        <li><a href="/#process" class="nav-link">How it works</a></li>
        <li><a href="/#contact" class="nav-link nav-link--cta">Book a free call</a></li>
      </ul>
      <a href="/#contact" class="btn btn--sm nav-cta">Book a free call</a>
      <button class="nav-menu-btn" id="nav-menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="map-page">

    <aside class="map-sidebar" aria-label="Project list">
      <div class="map-sidebar__header">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-cta" aria-hidden="true">
          <span>Projects (2)</span>
          <svg class="sheet-cta__chevron" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M3 10.5L8 5.5L13 10.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="map-sidebar__title">Project map</h1>
        <p class="map-sidebar__sub">Select a project to zoom to it.</p>
      </div>
      <div class="project-list" id="project-list"></div>
      <div class="sidebar-cs">
        <p class="sidebar-cs__label">Have a project in mind?</p>
        <p class="sidebar-cs__body">More projects get added here as they're published. Every one starts with a free call.</p>
        <a href="/#contact" class="btn btn--sm">Book a free call</a>
      </div>
    </aside>

    <div class="map-canvas">
      <div id="map"></div>
    </div>

  </div>


  <script>

    const PROJECTS = [
      {
        id: 'tacoma',
        index: '01',
        title: 'Tacoma, Washington · HQ',
        location: 'Tacoma, WA',
        coords: [-122.4443, 47.2529],
        zoom: 10,
        category: 'Headquarters',
        kind: 'HQ',
        desc: 'Third Rock Analytics is based in Tacoma. We work with nonprofits and private clients on environmental, land, and community GIS projects, mostly in the Pacific Northwest but anywhere the work makes sense.',
        stats: [
          { label: 'Clients', value: 'Orgs & landowners' },
          { label: 'Reach',   value: 'Nationwide' },
        ],
      },
      {
        id: 'mojave',
        index: '02',
        title: 'Mojave well monitoring dashboard',
        location: 'Mojave Desert, CA',
        coords: [-117.2183, 34.4851],
        zoom: 7,
        category: 'Live data',
        kind: 'Web dashboard',
        link: '/work/mojave-water-levels/',
        desc: 'Every groundwater monitoring well across a water agency service area on one map. Click any well to chart its full water-level history, pulled live from USGS.',
        stats: [
          { label: 'Wells',  value: '731' },
          { label: 'Service area', value: '4,873 sq mi' },
        ],
      },
    ];

    let activeId = 'tacoma';
    const markers = {};

    // Build sidebar list
    const listEl = document.getElementById('project-list');
    PROJECTS.forEach(p => {
      const item = document.createElement('div');
      item.className = 'project-item' + (p.id === activeId ? ' active' : '');
      item.dataset.id = p.id;
      item.innerHTML = `
        <div class="project-item__index">${p.index}</div>
        <div class="project-item__body">
          <div class="project-item__title">${p.title}</div>
          <div class="project-item__loc">${p.location} · ${p.kind}</div>
        </div>
      `;
      item.addEventListener('click', () => selectProject(p.id));
      listEl.appendChild(item);
    });

    // Init MapLibre
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/positron',
      center: [-120, 40],
      zoom: 4,
      attributionControl: { compact: true },
    });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

    map.on('load', () => {
      if (isMobile()) {
        map.setPadding({ bottom: 80, top: 0, left: 0, right: 0 });
      }
      PROJECTS.forEach(p => {
        const el = document.createElement('div');
        el.className = 'tr-marker' + (p.id === activeId ? ' active' : '');
        el.textContent = p.index;

        const statsHtml = p.stats.map(s =>
          `<div class="popup-stat"><b>${s.label}</b><span>${s.value}</span></div>`
        ).join('');

        const popup = new maplibregl.Popup({ offset: 20, closeButton: true })
          .setHTML(`
            <div class="popup-eyebrow">${p.category}</div>
            <div class="popup-title">${p.title}</div>
            <div class="popup-desc">${p.desc}</div>
            <div class="popup-stats">${statsHtml}</div>
            ${p.link ? `<a class="popup-link" href="${p.link}">Read how it was built →</a>` : ''}
          `);

        const marker = new maplibregl.Marker({ element: el })
          .setLngLat(p.coords)
          .setPopup(popup)
          .addTo(map);

        el.addEventListener('click', e => { e.stopPropagation(); selectProject(p.id); });
        markers[p.id] = { marker, el };
      });

      // Open HQ popup on load
      setTimeout(() => {
        const entry = markers[activeId];
        if (entry) entry.marker.togglePopup();
      }, 400);
    });

    function isMobile() { return window.innerWidth <= 780; }

    function selectProject(id) {
      activeId = id;
      const p = PROJECTS.find(x => x.id === id);
      if (!p) return;

      map.flyTo({
        center: p.coords, zoom: p.zoom, speed: 1.2, curve: 1.4,
        padding: isMobile() ? { bottom: 80, top: 0, left: 0, right: 0 } : {},
      });

      Object.entries(markers).forEach(([mid, { el, marker }]) => {
        el.classList.toggle('active', mid === id);
        const isOpen = marker.getPopup() && marker.getPopup().isOpen();
        if (mid === id && !isOpen) marker.togglePopup();
        if (mid !== id && isOpen)  marker.togglePopup();
      });

      document.querySelectorAll('.project-item').forEach(item => {
        item.classList.toggle('active', item.dataset.id === id);
      });

      if (isMobile()) {
        document.querySelector('.map-sidebar').classList.remove('sheet-open');
      }
    }

    // Bottom sheet toggle (mobile only)
    const sidebar = document.querySelector('.map-sidebar');
    document.querySelector('.map-sidebar__header').addEventListener('click', () => {
      if (isMobile()) sidebar.classList.toggle('sheet-open');
    });

    // Mobile nav
    const nav = document.getElementById('nav');
    const navBtn = document.getElementById('nav-menu-btn');
    navBtn.addEventListener('click', () => {
      navBtn.setAttribute('aria-expanded', String(nav.classList.toggle('nav--open')));
    });
    nav.querySelectorAll('.nav-links a').forEach(a => a.addEventListener('click', () => {
      nav.classList.remove('nav--open');
      navBtn.setAttribute('aria-expanded', 'false');
    }));
  </script>

</body>
</html>
